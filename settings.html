<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - Electron</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      margin: 0;
      height: 100vh;
      width: 100vw;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .settings-container {
      background: white;
      border-radius: 15px;
      padding: 25px;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    h2 {
      margin-bottom: 20px;
      color: #333;
      font-size: 22px;
    }

    .setting-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #666;
      font-size: 14px;
      font-weight: 500;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 16px;
      transition: all 0.3s;
      font-family: monospace;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .hint {
      margin-top: 8px;
      font-size: 12px;
      color: #999;
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.3s;
      font-weight: 500;
    }

    .save-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .save-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    .cancel-btn {
      background: #f0f0f0;
      color: #666;
    }

    .cancel-btn:hover {
      background: #e0e0e0;
    }

    .examples {
      background: #f8f9fa;
      padding: 12px;
      border-radius: 8px;
      margin-top: 10px;
      font-size: 13px;
      color: #666;
    }

    .examples strong {
      color: #333;
    }

    .success-message {
      display: none;
      background: #4caf50;
      color: white;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      text-align: center;
      animation: fadeIn 0.3s;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .quit-section {
      margin-top: 10px;
    }

    #quitBtn {
      background: #ff6b6b !important;
      color: white !important;
    }

    #quitBtn:hover {
      background: #ff5252 !important;
    }
  </style>
</head>
<body>
  <div class="settings-container">
    <div id="successMessage" class="success-message">Settings saved! Restart the app to apply changes.</div>
    
    <h2>⚙️ Settings</h2>
    
    <div class="setting-group">
      <label for="shortcutInput">Keyboard Shortcut</label>
      <input 
        type="text" 
        id="shortcutInput" 
        placeholder="CommandOrControl+Shift+T"
      >
      <div class="hint">
        Use modifiers: CommandOrControl, Shift, Alt, Super
      </div>
      <div class="examples">
        <strong>Examples:</strong><br>
        • CommandOrControl+Shift+T (default)<br>
        • Alt+Space<br>
        • CommandOrControl+` (backtick)<br>
        • CommandOrControl+Shift+K
      </div>
    </div>

    <div class="button-group">
      <button class="cancel-btn" id="cancelBtn">Cancel</button>
      <button class="save-btn" id="saveBtn">Save Changes</button>
    </div>

    <div class="button-group quit-section">
      <button id="quitBtn">Quit App</button>
    </div>
  </div>

  <script src="settings.js"></script>
</body>
</html>
