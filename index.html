<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Tasks</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>⚡ Quick Tasks</h1>
      <button id="settingsBtn" class="settings-btn" title="Settings">⚙️</button>
    </div>
    
    <div class="input-container">
      <input 
        type="text" 
        id="taskInput" 
        placeholder="Add a new task and press Enter..."
        autofocus
      >
      <button id="addBtn" class="add-btn">+</button>
    </div>

    <div class="stats">
      <span id="taskCount">0 tasks</span>
      <button id="toggleCompleted" class="toggle-completed">Show Completed (0)</button>
    </div>

    <ul id="taskList" class="task-list"></ul>

    <div class="footer">
      <p>Press <kbd id="shortcutDisplay">Ctrl+Shift+T</kbd> to hide/show</p>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
